services:
  db:
    image: postgres:16
    container_name: polysim-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polysim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polysim"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata: